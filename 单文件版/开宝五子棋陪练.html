    <style>
:root {
  --paper: #f4efe6;
  --paper-2: #ece4d6;
  --ink: #2c2723;
  --ink-2: #6f6558;
  --ink-3: #a1968a;
  --line: rgba(90, 72, 52, 0.14);
  --accent: #b3542f;
  --accent-soft: rgba(179, 84, 47, 0.12);
  --card: #fffdf9;
  --shadow: 0 12px 32px rgba(72, 52, 30, 0.16);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
    "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #171512;
    --paper-2: #211d19;
    --ink: #f0e9dd;
    --ink-2: #b3a897;
    --ink-3: #7d7466;
    --line: rgba(255, 240, 220, 0.12);
    --accent: #d8794f;
    --accent-soft: rgba(216, 121, 79, 0.16);
    --card: #221e1a;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  }
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  font-family: var(--font);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

.app {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  grid-template-columns: minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
  width: 100%;
  max-width: 100vw;
  overflow: hidden;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

/* ---------------------------------------------------------------- 顶栏 */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px 6px;
  min-width: 0;
}

.set-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  max-width: 62%;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.2px;
  padding: 6px 2px;
  cursor: pointer;
}

.set-btn span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.caret {
  width: 10px;
  height: 6px;
  flex: 0 0 auto;
  opacity: 0.5;
}

.meta {
  font-size: 13px;
  color: var(--ink-2);
  display: inline-flex;
  gap: 6px;
  align-items: baseline;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  flex: 0 0 auto;
}

.meta .sep {
  color: var(--ink-3);
}

/* ---------------------------------------------------------------- 棋盘 */
.stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  display: grid;
  place-items: center;
  padding: 4px 12px;
}

#board {
  display: block;
  max-width: 100%;
  max-height: 100%;
  touch-action: none;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(70, 48, 24, 0.18), 0 1px 2px rgba(70, 48, 24, 0.12);
}

/* ---------------------------------------------------------------- 状态条 */
.statusbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 30px;
  font-size: 14px;
  color: var(--ink-2);
  letter-spacing: 0.2px;
  padding: 0 16px;
  text-align: center;
}

.turn-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #2b2b32;
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 0 0 1px rgba(0, 0, 0, 0.16);
  flex: 0 0 auto;
  transition: background 160ms ease;
}

.turn-dot.white {
  background: #f7f4ee;
  box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.14), 0 0 0 1px rgba(0, 0, 0, 0.2);
}

.turn-dot.hidden {
  visibility: hidden;
}

/* ---------------------------------------------------------------- 工具栏 */
.toolbar {
  display: grid;
  grid-template-columns: 44px 1fr 1fr 1fr 44px;
  gap: 8px;
  align-items: center;
  padding: 6px 14px 12px;
}

.tool {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  border-radius: 13px;
  height: 46px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 120ms ease, background 160ms ease, opacity 160ms ease;
}

.tool:active {
  transform: scale(0.96);
  background: var(--paper-2);
}

.tool:disabled {
  opacity: 0.34;
  cursor: default;
}

.tool svg {
  width: 20px;
  height: 20px;
}

/* ---------------------------------------------------------------- 提示气泡 */
.toast {
  position: absolute;
  left: 50%;
  bottom: 22px;
  transform: translate(-50%, 12px);
  background: rgba(38, 32, 26, 0.9);
  color: #fdf8f0;
  font-size: 13.5px;
  line-height: 1.4;
  padding: 9px 16px;
  border-radius: 999px;
  max-width: 86%;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms ease, transform 200ms ease;
  backdrop-filter: blur(8px);
  z-index: 5;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ---------------------------------------------------------------- 习题集选择 */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(30, 24, 18, 0.42);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: flex-end;
  z-index: 40;
  animation: fadeIn 180ms ease;
}

.sheet {
  width: 100%;
  max-height: 82vh;
  background: var(--paper);
  border-radius: 22px 22px 0 0;
  padding: 8px 0 calc(12px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.22);
  animation: slideUp 260ms cubic-bezier(0.22, 1, 0.36, 1);
}

.sheet-grip {
  width: 38px;
  height: 5px;
  border-radius: 3px;
  background: var(--line);
  margin: 6px auto 4px;
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 18px 10px;
}

.sheet-head h2 {
  font-size: 17px;
  margin: 0;
  font-weight: 600;
}

.text-btn {
  border: 0;
  background: transparent;
  color: var(--accent);
  font-family: inherit;
  font-size: 15.5px;
  font-weight: 500;
  padding: 6px 2px;
  cursor: pointer;
}

.set-list {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.set-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  color: var(--ink);
  transition: background 150ms ease, border-color 150ms ease;
}

.set-item:active {
  background: var(--paper-2);
}

.set-item.current {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent) inset;
}

.set-item .info {
  flex: 1;
  min-width: 0;
}

.set-item .name {
  font-size: 15.5px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.set-item .sub {
  font-size: 12.5px;
  color: var(--ink-2);
  margin-top: 3px;
}

.set-item .progress {
  height: 4px;
  border-radius: 2px;
  background: var(--line);
  margin-top: 7px;
  overflow: hidden;
}

.set-item .progress > i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 300ms ease;
}

.set-item .del {

    <script>
/*
 * 五子棋（有禁手）规则引擎 + AI
 * ------------------------------------------------
 * 纯 JavaScript 实现，同时可用于浏览器（window.Renju）与 Node（module.exports）。
 *
 * 规则要点（标准连珠／五子棋禁手规则）：
 *  - 棋盘 15×15，黑先。
 *  - 黑棋五连为胜；黑棋出现「长连」（六连及以上）为禁手，判负。
 *  - 黑棋「四四禁手」「三三禁手」判负。
 *  - 白棋无禁手，五连及以上均为胜。
 *  - 五连优先：若一着同时成五与长连，判胜而非禁手。
 *
 * 坐标系：x 为列（0..14，对应 A..O），y 为行（0..14，对应 1..15）。
 * 数组下标 i = y * 15 + x。
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) {
    module.exports = factory();
  } else {
    root.Renju = factory();
  }
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  var N = 15;
  var NN = 225;
  var EMPTY = 0;
  var BLACK = 1;
  var WHITE = 2;

  // 四个方向：横、竖、右下、左下
  var DIRS = [
    [1, 0],
    [0, 1],
    [1, 1],
    [1, -1],
  ];

  // ---------------------------------------------------------------- 形状分值
  var S_FIVE = 10000000;
  var S_OPEN_FOUR = 260000;
  var S_FOUR = 48000;
  var S_OPEN_THREE = 22000;
  var S_THREE = 1100;
  var S_OPEN_TWO = 700;
  var S_TWO = 110;
  var S_ONE = 6;
  var WIN_SCORE = 8000000;

  // ------------------------------------------------------------ 线路预计算
  // LINES[d] = [[i0, i1, ...], ...] 每条线上按顺序的格子下标（长度 >= 5）
  // LINE_ID[d][i] = 线序号，LINE_POS[d][i] = 在该线上的位置
  var LINES = [];
  var LINE_ID = [];
  var LINE_POS = [];
  (function buildLines() {
    for (var d = 0; d < 4; d++) {
      var dx = DIRS[d][0];
      var dy = DIRS[d][1];
      var lines = [];
      var ids = new Int16Array(NN).fill(-1);
      var pos = new Int16Array(NN).fill(-1);
      for (var y = 0; y < N; y++) {
        for (var x = 0; x < N; x++) {
          var px = x - dx;
          var py = y - dy;
          if (px >= 0 && px < N && py >= 0 && py < N) continue; // 不是线首
          var cells = [];
          var cx = x;
          var cy = y;
          while (cx >= 0 && cx < N && cy >= 0 && cy < N) {
            cells.push(cy * N + cx);
            cx += dx;
            cy += dy;
          }
          if (cells.length >= 5) {
            var li = lines.length;
            lines.push(cells);
            for (var k = 0; k < cells.length; k++) {
              ids[cells[k]] = li;
              pos[cells[k]] = k;
            }
          }
        }
      }
      LINES.push(lines);
      LINE_ID.push(ids);
      LINE_POS.push(pos);
    }
  })();

  // ---------------------------------------------------------------- 工具函数
  function inBoard(x, y) {
    return x >= 0 && x < N && y >= 0 && y < N;
  }

  // 经过 (x, y) 且该点为 c 色时，该方向连续同色子数
  function runThrough(cells, x, y, d, c) {
    var dx = DIRS[d][0];
    var dy = DIRS[d][1];
    var n = 1;
    var nx = x + dx;
    var ny = y + dy;
    while (nx >= 0 && nx < N && ny >= 0 && ny < N && cells[ny * N + nx] === c) {
      n++;
      nx += dx;
      ny += dy;
    }
    nx = x - dx;
    ny = y - dy;
    while (nx >= 0 && nx < N && ny >= 0 && ny < N && cells[ny * N + nx] === c) {
      n++;
      nx -= dx;
      ny -= dy;
    }
    return n;
  }

  // 在 (x,y) 放 c 后是否成「正好五连」（长连不算）
  function makesFive(cells, x, y, c) {
    for (var d = 0; d < 4; d++) {
      if (runThrough(cells, x, y, d, c) === 5) return true;
    }
    return false;
  }

  function maxRun(cells, x, y, c) {
    var m = 0;
    for (var d = 0; d < 4; d++) {
      var r = runThrough(cells, x, y, d, c);
      if (r > m) m = r;
    }
    return m;
  }

  // ------------------------------------------------------------ 五连点判定
  // 在长度 15 的窗口 seq 中，统计「补一子即成正好五连」的空点。
  // 要求该五连窗口同时包含 around 与 also 两个下标（用于限定与本次落子相关）。
  function countFivePoints(seq, around, also, c) {
    var lo = Math.max(1, around - 4);
    var hi = Math.min(9, around);
    var cnt = 0;
    for (var s = lo; s <= hi; s++) {
      if (also < s || also > s + 4) continue;
      var empties = 0;
      var ok = true;
      for (var k = s; k <= s + 4; k++) {
        var v = seq[k];
        if (v === c) continue;
        if (v === 0) {
          empties++;
          if (empties > 1) {
            ok = false;
            break;
          }
        } else {
          ok = false;
          break;
        }
      }
      if (!ok || empties !== 1) continue;
      if (seq[s - 1] === c || seq[s + 5] === c) continue; // 会成长连，不算五

  var SEQ_POOL = [];

    var buf = SEQ_POOL[slot];

    var dx = DIRS[d][0];
    var dy = DIRS[d][1];

      var nx = x + dx * o;
      var ny = y + dy * o;
      buf[k] = nx >= 0 && nx < N && ny >= 0 && ny < N ? cells[ny * N + nx] : 3;
    }
    return buf;
  }

  var CENTER = 7;

  // 分析 (x,y) 刚落下的 c 子在方向 d 上形成的形状
  // 返回 { four, openFour, openThree }
  function analyzeShapes(cells, x, y, d, c, depth) {
    var slot = typeof depth === "number" ? depth : 0;
    var seq = buildSeq(cells, x, y, d, slot);
    var fours = countFivePoints(seq, CENTER, CENTER, c);
    if (fours > 0) {
      return { four: true, openFour: fours >= 2, openThree: false };
    }
    // 活三：存在空点 i，补子后形成活四（两个成五点），且该补点本身不是禁手
    var dx = DIRS[d][0];
    var dy = DIRS[d][1];
    for (var i = CENTER - 4; i <= CENTER + 4; i++) {

      seq[i] = c;
      var pts = countFivePoints(seq, i, CENTER, c);
      seq[i] = 0;

  // ------------------------------------------------------------ 单线估值
  // 对一条线分别计算黑白两色得分，并回传五连点信息
  function evalLineInto(cells, lineCells, out) {

    var first = true;
    for (var k = 0; k < moves.length; k++) {
      var i = moves[k];

      var beta = Infinity;

      for (var k = 0; k < rootMoves.length; k++) {

        var y = (i / N) | 0;

          localMove = i;
        }
        if (val > alpha) alpha = val;
      }
      if (this.stopped) break;
      if (localBest > -Infinity) {
        bestMove = localMove;
        bestScore = localBest;
        reachedDepth = depth;
        // 找到必胜/必败即可提前结束
        if (Math.abs(bestScore) > WIN_SCORE / 2) break;
      }
    }

      var fallback = this._genMoves(c, 1);
      bestMove = fallback.length ? fallback[0] : -1;
      bestScore = 0;
    }
    return {
      move: bestMove,
      score: bestScore,
      depth: reachedDepth,
      nodes: this.nodes,
      win: bestScore > WIN_SCORE / 2,
      lost: bestScore < -WIN_SCORE / 2,
    };
  };

  return {
    N: N,
    NN: NN,
    EMPTY: EMPTY,
    BLACK: BLACK,
    WHITE: WHITE,
    DIRS: DIRS,

    },

        return { ok: true, result: "forbidden", forbiddenType: ft, text: FORBIDDEN_TEXT[ft] };
      }
    }

    this.board.place(x, y, c);
    this.moves++;

    if (R.makesFive(this.board.cells, x, y, c)) {
      if (c === this.playerColor) {
        this.status = "won";
        this.result = "win";
        this.reason = "five";
      } else {
        this.status = "lost";
        this.result = "lose";
        this.reason = "five";
      }
      return { ok: true, result: this.result };
    }

    if (this.board.count >= 225) {
      this.status = "draw";
      this.result = "draw";
      this.reason = "full";
      return { ok: true, result: "draw" };
    }

    this.side = 3 - c;
    return { ok: true, result: "continue" };
  };

  // AI 走一步，返回 { x, y, result, info } 或 null
  Game.prototype.aiMove = function (opts) {
    if (this.status !== "playing") return null;
    opts = opts || {};
    var color = this.side;
    if (color === this.playerColor) return null; // 还没轮到 AI
    var s = new R.Search(this.board, { maxCandidates: this.aiCandidates });
    var info = s.search(color, {
      timeMs: opts.timeMs || this.aiTimeMs,
      maxDepth: opts.maxDepth || this.aiDepth,
    });
    if (info.move < 0) return null;
    var x = info.move % N;
    var y = (info.move / N) | 0;
    var res = this.playAt(x, y);
    return { x: x, y: y, result: res.result, info: info };
  };

  // 悔棋：退回轮到玩家行棋的状态
  Game.prototype.undo = function () {
    if (!this.board.history.length) return false;
    this.status = "playing";
    this.result = null;
    this.reason = "";
    this.forbiddenAt = -1;
    this.board.undo();
    this.moves = Math.max(0, this.moves - 1);
    this.side = this.board.count ? this.sideAfterUndo() : this.playerColor;
    var guard = 0;
    while (this.side !== this.playerColor && this.board.history.length && guard++ < 4) {
      this.board.undo();
      this.moves = Math.max(0, this.moves - 1);
      this.side = this.board.count ? this.sideAfterUndo() : this.playerColor;
    }
    return true;
  };

  Game.prototype.sideAfterUndo = function () {
    // 依据棋子数推断轮次（题目初始局面黑棋数 >= 白棋数）
    var b = 0;
    var w = 0;
    var cells = this.board.cells;
    for (var i = 0; i < 225; i++) {
      if (cells[i] === 1) b++;
      else if (cells[i] === 2) w++;
    }
    return b === w ? 1 : 2;
  };

  Game.prototype.lastMove = function () {
    return this.board.lastMove;
  };

  Game.prototype.moveCount = function () {
    return this.moves;
  };

  Game.FORBIDDEN_TEXT = FORBIDDEN_TEXT;
  return Game;
});

window.ABOUT_HTML = "<p>“开宝五子棋陪练”应用简介</p>\n<p>你好！</p>\n<p>很高兴你能点击“关于”按钮并看到这里。这是一款专门为练习五子棋习题（有禁手）而开发的应用，其最大的特色是开放、免费且无广告。该应用除了内置的三手胜等常见习题集外，还支持用户通过外部文件导入自定义的习题集。</p>\n<p>本应用纯粹是因为女儿和自己玩乐的需要但市面上又没有好用的应用情况下，作为资深程序员的我一有不爽就自己抽空开发的。女儿作为首个玩家试用了应用的内测版本并提出了好几个很棒的改进意见，我都一一采纳了。</p>\n<p>本文分以下四个部分，如果你只是玩家而不是开发者，最多只需要看前两个部分，后两个部分是写给开发者的。</p>\n<h3>一、隐私政策声明</h3>\n<h4>1）个人用户信息</h4>\n<p>本软件不搜集有关用户或访问者的任何个人信息。用户无需任何注册或联网，即可自由使用本软件的所有功能。</p>\n<h4>2）软件中的链接</h4>\n<p>本软件的帮助页面中包含指向其他站点的链接。我们不对这些网站中的隐私实践或内容负责。本隐私政策仅适用于本软件。</p>\n<h3>二、导入格式说明</h3>\n<p>应用本身的使用是不需要帮助的也不应该有帮助，如果需要帮助的话就说明应用的UI设计得不自然。此处只对外部导入的习题集文件的格式予以说明。</p>\n<p>习题集文件的数据内容采用主流的JSON格式，是一个二维字符串数组。最外层数组的每个元素是一个一维字符串数组，表示一道习题。一维字符串数组的每个字符串元素表示一个棋子的坐标和颜色，格式为“XY,C”。</p>\n<p>其中X是横坐标，用大写字母表示，范围是A~O。Y是纵坐标，用数字表示，范围是1~15。C是颜色，只有黑色和白色，分别用1和2表示。</p>\n<p>下面给出一个简单的例子方便理解。导入的习题集文件的文件名为“例子习题集.json”，其中json后缀是必需的。该习题集包含2道习题，第1道习题有3颗黑棋和2颗白棋，第2道习题有2颗黑棋和2颗白棋。</p>\n<p>[</p>\n<p>[\"F10,1\", \"H10,2\", \"G9,1\",\"I9,2\", \"J9,1\"],</p>\n<p>[\"H6,2\", \"I6,1\", \"J6,1\", \"K6,2\"]</p>\n<p>]</p>\n<h3>三、开发背景介绍</h3>\n<p>本应用的开发包含三个部分， UI前端、AI算法和扫描工具。</p>\n<h4>1）UI前端</h4>\n<p>使用Kotlin语言以及Jetpack Compose UI库开发，主要就是写Composable函数，显示棋盘、棋子和一些按钮，响应用户的点击和滑动操作，以及保存和恢复数据。Jetpack Compose确实可大幅减少代码量，使UI前端的代码量只有不到一千行。</p>\n<h4>2）AI算法</h4>\n<p>搜索了网上已有的五子棋算法开源库后，最后选择了郝天一在2019年开源的SlowRenju（<a href=\"https://github.com/wind23/SlowRenju\" target=\"_blank\" rel=\"noopener\">https://github.com/wind23/SlowRenju</a> ），该C++算法库的棋力很强，在国际大赛中能排名前5。但我针对本应用是用于做题的特殊需求，对该算法库做了一个简单的JNI层封装，方便UI前端Kotlin代码的调用。封装函数中将搜索节点数量和搜索深度做了限制，以便能较快响应玩家的落子。经过测试一些三手胜的经典习题，基本够用。</p>\n<h4>3）扫描工具</h4>\n<p>如何获得三手胜习题库的JSON数据呢？看着书手工一题一题地录入显然不符合程序员的原则。好在有强大的开源计算机视觉库OpenCV，基于这个库只用300行C++代码就实现了自动扫描书中的习题并生成JSON数据文件。本应用内置的三手胜从入门到高级等6个习题集就是这样用工具生成的。</p>\n<h3>四、开源代码公开</h3>\n<p>基于SlowRenju算法库的JNI封装函数的C++代码开源如下：</p>\n<p>/*</p>\n<p>(C) 2022-2032 孙俊</p>\n<p>This program is free software: you can redistribute it and/or modify</p>\n<p>it under the terms of the GNU General Public License as published by</p>\n<p>the Free Software Foundation, either version 3 of the License, or</p>\n<p>(at your option) any later version.</p>\n<p>This program is distributed in the hope that it will be useful,</p>\n<p>but WITHOUT ANY WARRANTY; without even the implied warranty of</p>\n<p>MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the</p>\n<p>GNU General Public License for more details.</p>\n<p>You should have received a copy of the GNU General Public License</p>\n<p>along with this program. If not, see &lt;http://www.gnu.org/licenses/&gt;.</p>\n<p>*/</p>\n<pre class=\"code\">#ifdef ANDROID\n#include &quot;Headers/game.h&quot;\n#include &lt;jni.h&gt;\nstatic int testWin(int x, int y) {\nline4v line4v;\nif (line4v.A5(x, y)) return board[x][y];\nif (line4v.foulr(x, y)) return -1;\nreturn 0;\n}\nextern &quot;C&quot; JNIEXPORT jint JNICALL Java_com_js_renju_Ai_findMove\n(JNIEnv *env, jobject Ai, jobjectArray allMoves, jint lastMove) {\nbmove = 0;\nint x, y;\nfor (x = 0; x &lt; 15; x++) {\njintArray intArray = (jintArray) env-&gt;GetObjectArrayElement(allMoves, x);\njint *line = env-&gt;GetIntArrayElements(intArray, NULL);\nfor (y = 0; y &lt; 15; y++) {\nboard[x][y] = line[y];\nboard[x][y] ? bmove++ : 0;\n}\nenv-&gt;ReleaseIntArrayElements(intArray, line, 0);\n}\nint whoWin = testWin(lastMove % 15, lastMove / 15);\nif (whoWin) {\nreturn (whoWin &lt;&lt; 16) | 0xffff;\n}\nif (bmove == 225) {\nreturn 0xffff;\n}\nmoven = bmove;\ncompend = 0;\nfflag = 1;\nnodelimit = 2000000;\nint thisMove = rootsearch(6, 60, 1, 1);\nif (thisMove &gt;= 0) {\nx = thisMove % 15;\ny = thisMove / 15;\nboard[x][y] = moven % 2 ? -1 : 1;\nreturn (testWin(x, y) &lt;&lt; 16) | thisMove;\n}\nreturn thisMove &amp; 0xffff;\n}\nextern &quot;C&quot; JNIEXPORT jint JNICALL Java_com_js_renju_Ai_stopThinking\n(JNIEnv *, jclass) {\ncompend = 1;\nreturn 0;\n}\n#endif</pre>\n<p>最后，祝大家玩得开心、编程快乐！</p>\n<p>作者：孙俊</p>\n<p>2022年春天于江城</p>";

</script>
    <script>
/* 界面层：棋盘渲染、手势、题库管理、进度保存 */
(function () {
  "use strict";

  var R = window.Renju;
  var Game = window.RenjuGame;

  // ---------------------------------------------------------------- 存储
  var STORE_KEY = "renju.store.v1";

  function defaultStore() {
    return {
      progress: {}, // setId -> [puzzleIndex...]
      imported: [], // [{id,name,puzzles}]
      ui: { agreed: false, skin: 0, lastSet: null, lastPuzzle: 0 },
      resume: null, // {setId, puzzleIndex, moves:[[x,y]...]}
    };
  }

  var store = defaultStore();
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") {
        store.progress = parsed.progress || {};
        store.imported = Array.isArray(parsed.imported) ? parsed.imported : [];
        store.ui = Object.assign(defaultStore().ui, parsed.ui || {});
        store.resume = parsed.resume || null;
      }
    }
  } catch (e) {
    /* 存储不可用时静默降级 */
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(store));
    } catch (e) {
      /* 忽略配额错误 */
    }
  }

  // ---------------------------------------------------------------- 状态
  var sets = [];
  var state = {
    setIndex: 0,
    puzzleIndex: 0,
    game: null,
    thinking: false,
  };

  function makeSet(def, builtin) {
    return {
      id: def.id,
      name: def.name,
      puzzles: def.puzzles,
      builtin: !!builtin,
    };
  }

  function loadSets() {
    sets = (window.BUILTIN_SETS || []).map(function (s) {
      return makeSet(s, true);
    });
    (store.imported || []).forEach(function (s) {
      if (s && s.id && Array.isArray(s.puzzles)) sets.push(makeSet(s, false));
    });
  }

  function solvedOf(set) {
    var arr = store.progress[set.id];
    return Array.isArray(arr) ? arr : [];
  }

  function isSolved(set, idx) {
    return solvedOf(set).indexOf(idx) !== -1;
  }

  function markSolved(set, idx) {
    var arr = store.progress[set.id] || (store.progress[set.id] = []);
    if (arr.indexOf(idx) === -1) arr.push(idx);
    save();
  }

  // ---------------------------------------------------------------- 元素
  var $ = function (id) {
    return document.getElementById(id);
  };
  var canvas = $("board");
  var ctx = canvas.getContext("2d");
  var stage = $("stage");
  var toastEl = $("toast");

  // ---------------------------------------------------------------- 棋盘绘制
  var geo = { size: 300, cell: 19, pad: 18, dpr: 1 };

  var SKINS = [
    {
      bg1: "#ecceA0".toLowerCase(),
      bg2: "#d8ae78",
      line: "rgba(92,62,30,0.5)",
      star: "rgba(92,62,30,0.7)",
      text: "rgba(92,62,30,0.72)",
      grain: "rgba(150,110,66,0.05)",
    },
    {
      bg1: "#5c6674",
      bg2: "#39414d",
      line: "rgba(228,236,248,0.34)",
      star: "rgba(228,236,248,0.45)",
      text: "rgba(228,236,248,0.6)",
      grain: "rgba(255,255,255,0.035)",
    },
  ];

  function currentSkin() {
    return SKINS[store.ui.skin % SKINS.length] || SKINS[0];
  }

  function resize() {
    var cs = window.getComputedStyle(stage);
    var padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    var padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    var availW = stage.clientWidth - padX;
    var availH = stage.clientHeight - padY;
    var size = Math.floor(Math.min(availW, availH));
    if (!isFinite(size) || size < 160) size = Math.max(160, Math.floor(availW) || 160);
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    var cell = size / 15.8;
    geo = { size: size, cell: cell, pad: cell * 0.9, dpr: dpr };
    draw();
  }

  function cellXY(gx, gy) {
    return [geo.pad + gx * geo.cell, geo.pad + (14 - gy) * geo.cell];
  }

  function drawBoardBg(skin) {
    var g = ctx.createLinearGradient(0, 0, geo.size, geo.size);
    g.addColorStop(0, skin.bg1);
    g.addColorStop(1, skin.bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, geo.size, geo.size);

    // 木纹
    ctx.strokeStyle = skin.grain;
    ctx.lineWidth = Math.max(1, geo.cell * 0.09);
    for (var i = 0; i < 22; i++) {
      var y = (i + 0.5) * (geo.size / 22) + Math.sin(i * 1.7) * 3;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.bezierCurveTo(geo.size * 0.3, y + 5, geo.size * 0.7, y - 5, geo.size, y + 2);
      ctx.stroke();
    }
    // 顶部柔光
    var glow = ctx.createRadialGradient(geo.size * 0.3, geo.size * 0.15, 10, geo.size * 0.3, geo.size * 0.15, geo.size * 0.9);
    glow.addColorStop(0, "rgba(255,255,255,0.16)");
    glow.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, geo.size, geo.size);
  }

  function drawGrid(skin) {
    var pad = geo.pad;
    var end = pad + 14 * geo.cell;
    ctx.strokeStyle = skin.line;
    ctx.lineWidth = Math.max(1, geo.cell * 0.035);
    ctx.beginPath();
    for (var k = 0; k < 15; k++) {
      var p = pad + k * geo.cell;
      ctx.moveTo(pad, p);
      ctx.lineTo(end, p);
      ctx.moveTo(p, pad);
      ctx.lineTo(p, end);
    }
    ctx.stroke();

    // 外框略粗
    ctx.lineWidth = Math.max(1.4, geo.cell * 0.06);
    ctx.strokeRect(pad, pad, end - pad, end - pad);

    // 星位
    var stars = [
      [3, 3],
      [11, 3],
      [3, 11],
      [11, 11],
      [7, 7],
    ];
    ctx.fillStyle = skin.star;
    stars.forEach(function (s) {
      var xy = cellXY(s[0], s[1]);
      ctx.beginPath();
      ctx.arc(xy[0], xy[1], Math.max(1.6, geo.cell * 0.075), 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawCoords(skin) {
    var letters = "ABCDEFGHIJKLMNO";
    ctx.fillStyle = skin.text;
    ctx.font =
      "500 " + Math.max(8, Math.round(geo.cell * 0.42)) + "px -apple-system, 'PingFang SC', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (var x = 0; x < 15; x++) {
      var p = cellXY(x, 0);
      ctx.fillText(letters[x], p[0], geo.pad * 0.5);
    }
    ctx.textAlign = "center";
    for (var y = 0; y < 15; y++) {
      var q = cellXY(0, y);
      ctx.fillText(String(y + 1), geo.pad * 0.5, q[1]);
    }
  }

  function drawStone(cx, cy, r, isBlack, skin) {
    ctx.save();
    ctx.shadowColor = "rgba(40,26,10,0.35)";
    ctx.shadowBlur = r * 0.55;
    ctx.shadowOffsetY = r * 0.16;

    var g = ctx.createRadialGradient(cx - r * 0.34, cy - r * 0.4, r * 0.12, cx, cy, r * 1.02);
    if (isBlack) {
      g.addColorStop(0, "#6f7180");
      g.addColorStop(0.42, "#2c2d35");
      g.addColorStop(1, "#0e0e12");
    } else {
      g.addColorStop(0, "#ffffff");
      g.addColorStop(0.55, "#f6f3ec");
      g.addColorStop(1, "#cfc7b8");
    }
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.lineWidth = Math.max(0.6, r * 0.055);
    ctx.strokeStyle = isBlack ? "rgba(0,0,0,0.45)" : "rgba(120,108,90,0.5)";
    ctx.stroke();

    // 高光
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.3, cy - r * 0.36, r * 0.34, r * 0.22, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = isBlack ? "rgba(255,255,255,0.16)" : "rgba(255,255,255,0.85)";
    ctx.fill();
  }

  function draw() {
    if (!geo.size) return;
    var skin = currentSkin();
    var dpr = geo.dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, geo.size, geo.size);
    drawBoardBg(skin);
    drawGrid(skin);
    drawCoords(skin);

    var game = state.game;
    if (!game) return;
    var cells = game.board.cells;
    var r = geo.cell * 0.43;
    var last = game.lastMove();

    for (var i = 0; i < 225; i++) {
      var v = cells[i];
      if (!v) continue;
      var xy = cellXY(i % 15, (i / 15) | 0);
      drawStone(xy[0], xy[1], r, v === 1, skin);
    }

    if (last >= 0) {
      var lp = cellXY(last % 15, (last / 15) | 0);
      ctx.beginPath();
      ctx.arc(lp[0], lp[1], r * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = "#e0552e";
      ctx.fill();
    }
  }

  // ---------------------------------------------------------------- 状态栏
  var turnDot = $("turnDot");

  function setStatus(text, dotColor) {
    $("statusText").textContent = text;
    turnDot.classList.toggle("hidden", !dotColor);
    turnDot.classList.toggle("white", dotColor === "white");
  }

  function sideName(c) {
    return c === 1 ? "黑" : "白";
  }

  function updateChrome() {
    var set = sets[state.setIndex];
    if (!set) return;
    $("setName").textContent = set.name;
    $("puzzleNo").textContent = "第 " + (state.puzzleIndex + 1) + " 题";
    $("solvedInfo").textContent = "已解 " + solvedOf(set).length;

    var game = state.game;
    var canSwitch = !game || game.moves === 0 || game.isOver();
    $("prevBtn").disabled = !canSwitch;
    $("nextBtn").disabled = !canSwitch;
    $("undoBtn").disabled = !game || game.moves === 0;

    if (!game) return;
    if (game.isOver()) {
      if (game.status === "won") setStatus("恭喜，你赢了！", null);
      else if (game.status === "draw") setStatus("和棋", null);
      else if (game.reason && game.reason.indexOf("forbidden") === 0) {
        var t = game.reason.split(":")[1];
        setStatus("禁手判负：" + (Game.FORBIDDEN_TEXT[t] || "禁手"), null);
      } else setStatus("遗憾，你输了。", null);
      return;
    }
    if (state.thinking) {
      setStatus("陪练思考中…", game.sideToMove() === 1 ? "black" : "white");
      return;
    }
    if (game.isPlayerTurn()) {
      setStatus("轮到你落子（" + sideName(game.sideToMove()) + "）", game.sideToMove() === 1 ? "black" : "white");
    } else {
      setStatus("等待陪练落子…", null);
    }
  }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 2100);
  }

  // ---------------------------------------------------------------- 对局
  function startPuzzle(setIndex, puzzleIndex, resumeMoves) {
    state.setIndex = setIndex;
    state.puzzleIndex = puzzleIndex;
    var set = sets[setIndex];
    if (!set) return;
    var flat = set.puzzles[puzzleIndex] || [];
    state.game = new Game(flat, { aiTimeMs: aiBudget(), aiDepth: 6 });
    if (resumeMoves && resumeMoves.length) {
      resumeMoves.forEach(function (m) {
        if (state.game.isOver()) return;
        state.game.playAt(m[0], m[1]);
      });
    }
    store.ui.lastSet = set.id;
    store.ui.lastPuzzle = puzzleIndex;
    store.resume = null;
    save();
    state.thinking = false;
    draw();
    updateChrome();
    if (!state.game.isOver() && !state.game.isPlayerTurn()) scheduleAI();
    if (state.game.isOver()) showResult(true);
  }

  function aiBudget() {
    // 老设备上适当收缩，保证响应速度
    var t = 380;
    if (typeof navigator !== "undefined" && (navigator.hardwareConcurrency || 4) <= 4) t = 300;
    return t;
  }

  function scheduleAI() {
    if (!state.game || state.game.isOver() || state.game.isPlayerTurn() || state.thinking) return;
    state.thinking = true;
    updateChrome();
    setTimeout(function () {
      var g = state.game;
      if (!g || g.isOver() || g.isPlayerTurn()) {
        state.thinking = false;
        updateChrome();
        return;
      }
      var mv = g.aiMove();
      state.thinking = false;
      draw();
      updateChrome();
      if (mv && g.isOver()) showResult();
      if (!g.isOver()) persistResume();
    }, 60);
  }

  function persistResume() {
    var g = state.game;
    if (!g || g.moves === 0) {
      store.resume = null;
      save();
      return;
    }
    var moves = [];
    // 由历史推回：只记录对局中玩家与 AI 的落子
    g.board.history.forEach(function (i) {
      moves.push([i % 15, (i / 15) | 0]);
    });
    store.resume = {
      setId: sets[state.setIndex].id,
      puzzleIndex: state.puzzleIndex,
      moves: moves,
    };
    save();
  }

  function onPlayerTap(gx, gy) {
    var g = state.game;
    if (!g) return;
    if (g.isOver()) {
      toast("本题已结束，可重来或切换题目");
      return;
    }
    if (!g.isPlayerTurn()) {
      toast("请等待陪练落子");
      return;
    }
    var res = g.playAt(gx, gy);
    if (!res.ok) {
      toast("这里已经有子了");
      return;
    }
    draw();
    updateChrome();
    if (g.isOver()) {
      showResult();
      return;
    }
    scheduleAI();
  }

  function restart() {
    var set = sets[state.setIndex];
    if (!set) return;
    startPuzzle(state.setIndex, state.puzzleIndex);
  }

  function undo() {
    var g = state.game;
    if (!g || g.moves === 0) return;
    g.undo();
    state.thinking = false;
    draw();
    updateChrome();
    persistResume();
  }

  function canSwitchPuzzle() {
    var g = state.game;
    return !g || g.moves === 0 || g.isOver();
  }

  function goPuzzle(delta) {
    var set = sets[state.setIndex];
    if (!set) return;
    if (!canSwitchPuzzle()) {
      toast("未落一子或已胜利时，可左右滑屏切换题目。");
      return;
    }
    var n = set.puzzles.length;
    var idx = state.puzzleIndex + delta;
    if (idx < 0) {
      toast("已经是第一题");
      return;
    }
    if (idx >= n) {
      toast("已经是最后一题");
      return;
    }
    startPuzzle(state.setIndex, idx);
  }

  // ---------------------------------------------------------------- 结果弹窗
  function showResult(isResume) {
    var g = state.game;
    if (!g) return;
    var icon = $("resultIcon");
    var title = $("resultTitle");
    var text = $("resultText");
    var set = sets[state.setIndex];

    if (g.status === "won") {
      icon.textContent = "✓";
      icon.classList.remove("lose");
      title.textContent = "恭喜，你赢了！";
      text.textContent = "请继续挑战下一题。";
      if (!isSolved(set, state.puzzleIndex)) {
        markSolved(set, state.puzzleIndex);
        updateChrome();
      }
      $("resultNext").classList.remove("hidden");
    } else if (g.status === "draw") {
      icon.textContent = "—";
      icon.classList.add("lose");
      title.textContent = "和棋";
      text.textContent = "棋盘已满，重新挑战这一题吧。";
      $("resultNext").classList.remove("hidden");
    } else {
      icon.textContent = "×";
      icon.classList.add("lose");
      if (g.reason && g.reason.indexOf("forbidden") === 0) {
        var t = g.reason.split(":")[1];
        title.textContent = "禁手判负";
        text.textContent = "黑棋 " + (Game.FORBIDDEN_TEXT[t] || "禁手") + "，本局判负。可以悔棋或重来。";
      } else {
        title.textContent = "遗憾，你输了。";
        text.textContent = "请重新挑战这一题。";
      }
      $("resultNext").classList.remove("hidden");
    }
    $("resultModal").classList.remove("hidden");
    // 已分胜负的棋局不再续局，避免下次打开时又弹出结算框
    store.resume = null;
    save();
  }

  function hideResult() {
    $("resultModal").classList.add("hidden");
  }

  // ---------------------------------------------------------------- 习题集面板
  function renderSetList() {
    var list = $("setList");
    list.innerHTML = "";
    sets.forEach(function (set, i) {
      var solved = solvedOf(set).length;
      var total = set.puzzles.length;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "set-item" + (i === state.setIndex ? " current" : "");
      var pct = total ? Math.round((solved / total) * 100) : 0;
      btn.innerHTML =
        '<div class="info">' +
        '<div class="name"></div>' +
        '<div class="sub">' +
        total +
        " 题 · 已解 " +
        solved +
        "</div>" +
        '<div class="progress"><i style="width:' +
        pct +
        '%"></i></div>' +
        "</div>";
      btn.querySelector(".name").textContent = set.name;
      btn.addEventListener("click", function () {
        openSet(i);
      });
      if (!set.builtin) {
        var del = document.createElement("button");
        del.type = "button";
        del.className = "del";
        del.textContent = "×";
        del.setAttribute("aria-label", "删除题库");
        del.addEventListener("click", function (ev) {
          ev.stopPropagation();
          deleteSet(i);
        });
        btn.appendChild(del);
      }
      list.appendChild(btn);
    });
  }

  function openSheet() {
    renderSetList();
    $("sheetBackdrop").classList.remove("hidden");
  }

  function closeSheet() {
    $("sheetBackdrop").classList.add("hidden");
  }

  function openSet(i) {
    closeSheet();
    var set = sets[i];
    if (!set) return;
    var solved = solvedOf(set);
    var start = 0;
    for (var k = 0; k < set.puzzles.length; k++) {
      if (solved.indexOf(k) === -1) {
        start = k;
        break;
      }
    }
    startPuzzle(i, start);
  }

  function deleteSet(i) {
    var set = sets[i];
    if (!set || set.builtin) return;
    if (!window.confirm("删除习题集「" + set.name + "」？解题进度也会一并删除。")) return;
    sets.splice(i, 1);
    store.imported = store.imported.filter(function (s) {
      return s.id !== set.id;
    });
    delete store.progress[set.id];
    if (state.setIndex >= sets.length) state.setIndex = 0;
    save();
    renderSetList();
    if (sets.length) {
      startPuzzle(Math.min(state.setIndex, sets.length - 1), 0);
    }
  }

  // ---------------------------------------------------------------- 导入
  function parsePuzzles(data) {
    if (!Array.isArray(data)) throw new Error("格式错误");
    var out = [];
    for (var i = 0; i < data.length; i++) {
      var q = data[i];
      if (!Array.isArray(q)) continue;
      var flat = [];
      for (var j = 0; j < q.length; j++) {
        var tok = q[j];
        if (typeof tok !== "string") continue;
        var parts = tok.split(",");
        if (parts.length !== 2) continue;
        var xy = parts[0].trim().toUpperCase();
        var col = parts[1].trim();
        if (xy.length < 2) continue;
        var x = xy.charCodeAt(0) - 65;
        var y = parseInt(xy.slice(1), 10) - 1;
        if (!(x >= 0 && x < 15 && y >= 0 && y < 15)) continue;
        if (col !== "1" && col !== "2") continue;
        flat.push(x, y, col === "1" ? 1 : 2);
      }
      if (flat.length >= 6) out.push(flat);
    }
    return out;
  }

  function handleImport(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(String(reader.result));
        var puzzles = parsePuzzles(data);
        if (!puzzles.length) throw new Error("无有效题目");
        var name = file.name.replace(/\.json$/i, "") || "自定义题库";
        if (
          sets.some(function (s) {
            return s.name === name;
          })
        ) {
          toast("已有同名习题集!");
          return;
        }
        var id = "imp_" + Date.now().toString(36);
        var def = { id: id, name: name, puzzles: puzzles };
        store.imported.push(def);
        sets.push(makeSet(def, false));
        save();
        renderSetList();
        toast("已导入「" + name + "」共 " + puzzles.length + " 题");
      } catch (e) {
        toast("习题集数据错误!");
      }
    };
    reader.onerror = function () {
      toast("文件读取失败");
    };
    reader.readAsText(file, "utf-8");
  }

  // ---------------------------------------------------------------- 手势
  var pointer = null;

  function stagePoint(ev) {
    var rect = canvas.getBoundingClientRect();
    return [ev.clientX - rect.left, ev.clientY - rect.top];
  }

  function pxToCell(px, py) {
    var gx = Math.round((px - geo.pad) / geo.cell);
    var srow = Math.round((py - geo.pad) / geo.cell);
    var gy = 14 - srow;
    if (gx < 0 || gx > 14 || gy < 0 || gy > 14) return null;
    var c = cellXY(gx, gy);
    if (Math.hypot(px - c[0], py - c[1]) > geo.cell * 0.66) return null;
    return [gx, gy];
  }

  canvas.addEventListener("pointerdown", function (ev) {
    if (ev.pointerType === "mouse" && ev.button !== 0) return;
    pointer = { x: ev.clientX, y: ev.clientY, moved: false, id: ev.pointerId };
    try {
      canvas.setPointerCapture(ev.pointerId);
    } catch (e) {
      /* 忽略 */
    }
  });

  canvas.addEventListener("pointermove", function (ev) {
    if (!pointer) return;
    if (Math.hypot(ev.clientX - pointer.x, ev.clientY - pointer.y) > 10) pointer.moved = true;
  });

  canvas.addEventListener("pointerup", function (ev) {
    if (!pointer) return;
    var dx = ev.clientX - pointer.x;
    var dy = ev.clientY - pointer.y;
    var dist = Math.hypot(dx, dy);
    var wasMoved = pointer.moved;
    pointer = null;

    if (!wasMoved && dist < 12) {
      var p = stagePoint(ev);
      var cell = pxToCell(p[0], p[1]);
      if (cell) onPlayerTap(cell[0], cell[1]);
      return;
    }
    if (dist < 40) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      goPuzzle(dx < 0 ? 1 : -1);
    } else {
      toggleSkin();
    }
  });

  canvas.addEventListener("pointercancel", function () {
    pointer = null;
  });

  function toggleSkin() {
    store.ui.skin = (store.ui.skin + 1) % SKINS.length;
    save();
    draw();
    toast(store.ui.skin === 0 ? "棋盘背景：原木" : "棋盘背景：墨玉");
  }

  // ---------------------------------------------------------------- 按钮绑定
  $("setBtn").addEventListener("click", openSheet);
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheetBackdrop").addEventListener("click", function (ev) {
    if (ev.target === $("sheetBackdrop")) closeSheet();
  });
  $("prevBtn").addEventListener("click", function () {
    goPuzzle(-1);
  });
  $("nextBtn").addEventListener("click", function () {
    goPuzzle(1);
  });
  $("restartBtn").addEventListener("click", function () {
    hideResult();
    restart();
  });
  $("undoBtn").addEventListener("click", function () {
    hideResult();
    undo();
  });
  $("resultRetry").addEventListener("click", function () {
    hideResult();
    restart();
  });
  $("resultNext").addEventListener("click", function () {
    hideResult();
    if (canSwitchPuzzle()) goPuzzle(1);
    else {
      restart();
    }
  });
  $("aboutBtn").addEventListener("click", function () {
    $("aboutPage").classList.remove("hidden");
  });
  $("aboutClose").addEventListener("click", function () {
    $("aboutPage").classList.add("hidden");
  });
  $("importInput").addEventListener("change", function (ev) {
    var file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (file) handleImport(file);
  });

  // 隐私政策
  function showPrivacy() {
    $("privacyModal").classList.remove("hidden");
  }
  $("agreeBtn").addEventListener("click", function () {
    store.ui.agreed = true;
    save();
    $("privacyModal").classList.add("hidden");
  });
  $("declineBtn").addEventListener("click", function () {
    toast("需要同意隐私政策才能使用本应用");
  });

  // 快捷键（桌面调试用）
  window.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft") goPuzzle(-1);
    else if (ev.key === "ArrowRight") goPuzzle(1);
    else if (ev.key === "z" && (ev.metaKey || ev.ctrlKey)) undo();
  });

  window.addEventListener("resize", function () {
    resize();
  });
  window.addEventListener("orientationchange", function () {
    setTimeout(resize, 260);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () {
      resize();
    });
  }

  // ---------------------------------------------------------------- 启动
  function boot() {
    loadSets();
    if (!sets.length) {
      document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">题库载入失败</p>';
      return;
    }
    $("aboutBody").innerHTML = window.ABOUT_HTML || "";

    var startSet = 0;
    if (store.ui.lastSet) {
      var found = sets.findIndex(function (s) {
        return s.id === store.ui.lastSet;
      });
      if (found >= 0) startSet = found;
    }
    var startPuzzleIdx = store.ui.lastPuzzle || 0;
    var r = store.resume;
    if (r && r.setId === sets[startSet].id && typeof r.puzzleIndex === "number") {
      startPuzzleIdx = r.puzzleIndex;
    }
    if (startPuzzleIdx >= sets[startSet].puzzles.length) startPuzzleIdx = 0;

    resize();
    var resumeMoves = null;
    if (r && r.setId === sets[startSet].id && r.puzzleIndex === startPuzzleIdx) resumeMoves = r.moves;
    startPuzzle(startSet, startPuzzleIdx, resumeMoves);
    if (window.requestAnimationFrame) {
      requestAnimationFrame(function () {
        resize();
      });
    }

    if (!store.ui.agreed) showPrivacy();

    // Service Worker：仅在 http(s) 下注册
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }

    setupInstallHint();
  }

  // iOS Safari 里提示「添加到主屏幕」；已装到桌面或用户关过一次就不再显示
  function setupInstallHint() {
    var bar = document.getElementById("installBar");
    if (!bar) return;
    var ua = navigator.userAgent || "";
    var isIOS =
      /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var standalone =
      navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    var KEY = "kaibao.installHint";
    var dismissed = false;
    try {
      dismissed = localStorage.getItem(KEY) === "1";
    } catch (e) {}
    if (!isIOS || standalone || dismissed) return;
    bar.hidden = false;
    document.getElementById("installClose").addEventListener("click", function () {
      bar.hidden = true;
      try {
        localStorage.setItem(KEY, "1");
      } catch (e) {}
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  // 调试/自动化测试句柄
  window.__renjuApp = {
    state: state,
    get sets() {
      return sets;
    },
    get geo() {
      return geo;
    },
    cellXY: cellXY,
    pxToCell: function (px, py) {
      return pxToCell(px, py);
    },
    store: store,
    startPuzzle: startPuzzle,
    goPuzzle: goPuzzle,
    toggleSkin: toggleSkin,
    draw: draw,
    updateChrome: updateChrome,
    resize: resize,
    scheduleAI: scheduleAI,
    undo: undo,
    restart: restart,
  };
})();

</script>
  </body>
</html>
